name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # docs/ is the published GitHub Pages site and is committed, so a PR
      # that changes src/ without rebuilding would silently ship stale code.
      #
      # Uses `git status --porcelain`, not `git diff`: diff only reports
      # modified/deleted TRACKED files, so a newly generated asset (sw.js, the
      # web manifest, a new public/ file) would pass while 404ing on the live
      # site. Porcelain sees untracked files too.
      - name: Fail if the published docs/ build is stale
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ is out of date or has uncommitted files. Run 'npm run build' and commit the result."
            git status --porcelain -- docs
            exit 1
          fi
