<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BOLT — Chrono Rush</title>
    <meta
      name="description"
      content="A free, open-source Sonic-style platformer that runs in your browser: a 42-act campaign across four biomes — loops, grind rails, minecarts, a hang glider — with every sprite and sound generated procedurally. No downloads."
    />
    <meta name="theme-color" content="#0b1026" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable, and playable offline once the service worker has cached it. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lp177.github.io/sonictribute/" />
    <meta property="og:image" content="https://lp177.github.io/sonictribute/social-card-v2.png" />
    <meta property="og:title" content="BOLT — Chrono Rush" />
    <meta
      property="og:description"
      content="A free, open-source Sonic-style platformer that runs in your browser: 42 acts, four biomes, everything drawn in code."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BOLT — Chrono Rush" />
    <meta
      name="twitter:description"
      content="A free, open-source Sonic-style platformer: 42 acts, four biomes, everything drawn in code."
    />
    <meta name="twitter:image" content="https://lp177.github.io/sonictribute/social-card-v2.png" />
  </head>
  <body>
    <div id="app">
      <canvas
        id="game"
        width="640"
        height="360"
        tabindex="0"
        aria-label="BOLT — Chrono Rush. A keyboard-controlled platform game."
      ></canvas>
      <noscript>
        <p class="fallback">
          <strong>BOLT — Chrono Rush</strong> is a game that runs entirely in your browser, so it
          needs JavaScript enabled. No data leaves your device.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
